<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostStory AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:25px;
  display:grid;place-items:center;
  background:radial-gradient(circle at top,#302044,#0c0b16 70%);
  color:#f5edff;font-family:Arial,sans-serif
}
main{
  width:100%;max-width:700px;padding:30px;
  background:#191526;border:1px solid #55416d;
  border-radius:20px;box-shadow:0 15px 60px #0008
}
h1{font-size:38px;margin:8px 0}
p{color:#c9bfd7;line-height:1.6}
.tag{color:#d5a8ff;font-weight:bold;letter-spacing:2px}
label{display:block;margin:20px 0 8px;font-weight:bold}
input,select{
  width:100%;padding:13px;border-radius:9px;
  background:#100e19;border:1px solid #57476b;
  color:white;font-size:16px
}
button{
  width:100%;padding:15px;margin-top:22px;
  border:0;border-radius:10px;background:#c99aff;
  color:#171020;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
#story{
  margin-top:24px;padding:20px;border-radius:12px;
  background:#100e19;border:1px solid #443451;
  white-space:pre-wrap;line-height:1.8;min-height:100px
}
footer{margin-top:20px;color:#aaa0b7;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="tag">A STORY FROM THE OTHER SIDE</div>
  <h1>GhostStory AI 👻</h1>
  <p>Step into the unknown. Create your own mysterious ghost story with the power of local AI.</p>

  <label for="character">Who is the main character?</label>
  <input id="character" placeholder="Example: A lonely traveller">

  <label for="setting">Where does the story happen?</label>
  <input id="setting" placeholder="Example: An abandoned mansion">

  <label for="mood">Choose your story mood</label>
  <select id="mood">
    <option>Scary and terrifying</option>
    <option>Mysterious and suspenseful</option>
    <option>Emotional and nostalgic</option>
  </select>

  <button id="generate" onclick="createStory()">Summon My Story 👻</button>

  <div id="story">Your ghost story will appear here...</div>

  <footer>Powered by Qwen 2.5 running locally through Ollama. Your prompts stay on your computer.</footer>
</main>

<script>
async function createStory(){
  const character=document.getElementById("character").value.trim();
  const setting=document.getElementById("setting").value.trim();
  const mood=document.getElementById("mood").value;
  const story=document.getElementById("story");
  const button=document.getElementById("generate");

  if(!character || !setting){
    story.textContent="Please enter both a character and a setting first.";
    return;
  }

  button.disabled=true;
  button.textContent="Summoning your story...";
  story.textContent="The spirits are gathering... Please wait.";

  try{
    const response=await fetch("http://localhost:11434/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"qwen2.5:1.5b",
        stream:false,
        prompt:`Write an original, engaging ghost story.
Main character: ${character}
Setting: ${setting}
Mood: ${mood}
Write a title and a story of around 250-350 words.
Make it atmospheric, creative, and give it a memorable ending.
Do not claim it is a true story.`
      })
    });

    if(!response.ok) throw new Error("Ollama error: "+response.status);
    const data=await response.json();
    story.textContent=data.response || "No story received. Try again.";
  }catch(error){
    story.textContent="Could not connect to Ollama.\nMake sure Ollama is running.\n\n"+error.message;
  }finally{
    button.disabled=false;
    button.textContent="Summon My Story 👻";
  }
}
</script>
</body>
</html>
